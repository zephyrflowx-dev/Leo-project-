name: Build Leo APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Leo ZIP found."
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Leo project
        shell: bash
        run: |
          set -e

          rm -rf outer-src build-src
          mkdir -p outer-src build-src

          unzip -q "$ZIP_FILE" -d outer-src

          SETTINGS=$(find outer-src -name "settings.gradle.kts" -print -quit)

          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS")
            cp -a "$PROJECT_DIR"/. build-src/
          else
            INNER_ZIP=$(find outer-src -type f -iname "leo-source.zip" -print -quit)

            if [ -z "$INNER_ZIP" ]; then
              INNER_ZIP=$(find outer-src -type f -iname "*.zip" -print -quit)
            fi

            if [ -z "$INNER_ZIP" ]; then
              echo "ERROR: Leo Android ZIP not found."
              exit 1
            fi

            echo "Inner ZIP: $INNER_ZIP"
            unzip -q "$INNER_ZIP" -d build-src
          fi

          SETTINGS=$(find build-src -name "settings.gradle.kts" -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Force Java 17
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          cat >> app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          echo "Java/Kotlin JVM target forced to 17."

      - name: Build Leo
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          gradle :app:assembleDebug --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/app-debug.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          cp "$APK" Leo.apk

          echo "================================"
          echo "LEO APK BUILD SUCCESSFUL"
          echo "================================"

          ls -lh Leo.apk

      - name: Upload Leo APK
        uses: actions/upload-artifact@v4
        with:
          name: Leo-v5.0-APK
          path: Leo.apk
          if-no-files-found: error
